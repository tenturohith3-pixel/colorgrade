[package]
name = "colorgrade-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance color grading microservice for ColorGrade"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Image processing
image = "0.25"

# LUT parsing
cube-lut = "0.1"

# Auth & security
jsonwebtoken = "9"
bcrypt = "0.15"

# Storage (S3-compatible)
aws-sdk-s3 = "1"
aws-config = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Rate limiting
governor = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Async
futures = "0.3"

# Config
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
